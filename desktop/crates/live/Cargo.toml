[package]
name = "pechu-live"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
futures-util = { workspace = true }
pechu-common = { workspace = true }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
base64 = "0.23.1"
url = "2.5.8"
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1.0.12"
# add tokio-tungstenite, base64 etc. with `cargo add -p pechu-live ...`
